<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grandpa Assistant</title>
<script src="https://js.puter.com/v2/"></script>
<script src="ai.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center}.app{width:min(900px,95%);text-align:center;padding:25px 0}h1{font-size:48px;margin:0 0 10px}#clock{font-size:60px;font-weight:bold;margin:15px}#status{font-size:28px;min-height:40px;margin:15px}#heard{font-size:23px;min-height:35px;margin:15px}.hint{font-size:18px;color:#ccc}button{border:0;border-radius:18px;padding:20px 30px;margin:8px;font-size:23px;font-weight:bold;cursor:pointer}#talkButton{width:85%;max-width:600px;background:#fff;color:#000}#wakeButton{width:85%;max-width:600px;background:#1976d2;color:#fff}.aiButton{width:85%;max-width:600px;background:#673ab7;color:#fff}.small{background:#333;color:#fff}#weather{background:#222;border-radius:20px;padding:20px;margin:25px auto;max-width:700px;font-size:27px}#timer{font-size:30px;margin:20px;min-height:40px}.contact{background:#222;border-radius:18px;padding:20px;margin:15px auto;max-width:700px}.contactName{font-size:28px;font-weight:bold;margin-bottom:10px}.call{background:#1769aa;color:#fff}.text{background:#388e3c;color:#fff}.remove{background:#8b0000;color:#fff;font-size:18px}#settings{background:#222;border-radius:20px;padding:25px;margin-top:25px}input{padding:15px;margin:8px;border-radius:10px;border:0;font-size:20px;width:80%;max-width:450px}.add{background:#1976d2;color:#fff}
</style>
</head>
<body>
<main class="app">
<h1>🎙️ Grandpa Assistant</h1>
<div id="clock">--:--</div>
<div id="status">Ready</div>
<div id="heard">Press TALK TO ME and ask me anything.</div>
<button id="talkButton" onclick="startListening()">🎤 TALK TO ME</button>
<button id="wakeButton" onclick="toggleWakeMode()">🟢 ENABLE "HEY ASSISTANT"</button>
<button class="aiButton" onclick="openAIChat()">🧠 ASK AI</button>
<div class="hint">Try: “What is a tornado?” or “Tell me a joke.”</div>
<div id="weather">🌤️ Loading weather...</div>
<div id="timer"></div>
<button class="small" onclick="sayTime()">🕐 What time is it?</button>
<button class="small" onclick="getWeather(true)">🌤️ Weather</button>
<button class="small" onclick="sayHello()">👋 Hello</button>
<button class="small" onclick="openYouTube()">▶️ YouTube</button>
<button class="small" onclick="openGoogle()">🔎 Google</button>
<h2>👨‍👩‍👧 Family</h2>
<div id="contacts"></div>
<section id="settings"><h2>➕ Add Family Contact</h2><input id="contactName" placeholder="Name"><br><input id="contactPhone" placeholder="Phone number" type="tel"><br><button class="add" onclick="addContact()">Add Contact</button></section>
</main>
<script>
let recognition=null;
let listeningForCommand=false;
let wakeMode=false;
let assistantSpeaking=false;
let timerInterval=null;

function speak(message){
  assistantSpeaking=true;
  if(recognition){try{recognition.stop()}catch(e){}}
  listeningForCommand=false;
  window.speechSynthesis.cancel();
  const speech=new SpeechSynthesisUtterance(String(message));
  speech.rate=.9;
  speech.pitch=1;
  document.getElementById('status').textContent='🔊 Speaking...';
  speech.onend=()=>{assistantSpeaking=false;document.getElementById('status').textContent='Ready';if(wakeMode)setTimeout(listenForWakeWord,1500)};
  speech.onerror=()=>{assistantSpeaking=false;document.getElementById('status').textContent='Ready'};
  window.speechSynthesis.speak(speech);
}

function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
setInterval(updateClock,1000);updateClock();
function sayTime(){speak('The time is '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}))}
function sayHello(){speak('Hello! How can I help you?')}

async function getWeather(speakWeather=false){
  const box=document.getElementById('weather');box.textContent='🌤️ Getting Artesia weather...';
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=32.8423&longitude=-104.4406&current=temperature_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph');
    if(!r.ok)throw Error();const d=await r.json();const t=Math.round(d.current.temperature_2m);const w=Math.round(d.current.wind_speed_10m);const desc=weatherDescription(d.current.weather_code);
    box.innerHTML='🌤️ <strong>Artesia, New Mexico</strong><br>'+t+'°F — '+desc+'<br>💨 Wind: '+w+' mph';
    if(speakWeather)speak('In Artesia, New Mexico, it is '+t+' degrees Fahrenheit and '+desc+'.');
  }catch(e){box.textContent='❌ Weather unavailable.';if(speakWeather)speak("Sorry, I couldn't get the weather.")}
}
function weatherDescription(c){if(c===0)return'clear skies';if(c===1||c===2)return'partly cloudy';if(c===3)return'cloudy';if(c>=45&&c<=48)return'foggy';if(c>=51&&c<=67)return'rain';if(c>=71&&c<=77)return'snow';if(c>=80&&c<=82)return'rain showers';if(c>=95)return'thunderstorms';return'unknown conditions'}
getWeather();

function setTimer(minutes){
  if(!minutes||minutes<=0){speak('Please tell me how many minutes.');return}
  if(timerInterval)clearInterval(timerInterval);let seconds=Math.round(minutes*60);const box=document.getElementById('timer');speak('Timer set for '+minutes+(minutes===1?' minute.':' minutes.'));
  function update(){const m=Math.floor(seconds/60),s=seconds%60;box.textContent='⏰ Timer: '+m+':'+String(s).padStart(2,'0');if(seconds<=0){clearInterval(timerInterval);timerInterval=null;box.textContent='🔔 TIMER FINISHED!';speak('Your timer is finished.');return}seconds--}
  update();timerInterval=setInterval(update,1000);
}
function openYouTube(){speak('Opening YouTube.');setTimeout(()=>window.open('https://www.youtube.com/','_blank'),1000)}
function openGoogle(){speak('Opening Google.');setTimeout(()=>window.open('https://www.google.com/','_blank'),1000)}

function getContacts(){try{return JSON.parse(localStorage.getItem('grandpaContacts'))||[]}catch(e){return[]}}
function saveContacts(c){localStorage.setItem('grandpaContacts',JSON.stringify(c));displayContacts()}
function addContact(){const name=document.getElementById('contactName').value.trim(),phone=document.getElementById('contactPhone').value.trim();if(!name||!phone){alert('Enter a name and phone number.');return}const c=getContacts();c.push({name,phone});saveContacts(c);document.getElementById('contactName').value='';document.getElementById('contactPhone').value='';speak(name+' has been added.')}
function displayContacts(){const box=document.getElementById('contacts'),c=getContacts();box.innerHTML='';if(!c.length){box.innerHTML='<p>No contacts yet.</p>';return}c.forEach((x,i)=>{const d=document.createElement('div');d.className='contact';d.innerHTML='<div class="contactName">👤 '+escapeHTML(x.name)+'</div><button class="call" onclick="callContact('+i+')">📞 Call</button><button class="text" onclick="textContact('+i+')">💬 Text</button><br><button class="remove" onclick="removeContact('+i+')">🗑️ Remove</button>';box.appendChild(d)})}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function callContact(i){const c=getContacts()[i];if(c&&confirm('Call '+c.name+'?'))window.location.href='tel:'+c.phone}
function textContact(i){const c=getContacts()[i];if(c&&confirm('Text '+c.name+'?'))window.location.href='sms:'+c.phone}
function removeContact(i){const c=getContacts(),x=c[i];if(x&&confirm('Remove '+x.name+'?')){c.splice(i,1);saveContacts(c)}}
displayContacts();

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
  recognition=new SpeechRecognition();
  recognition.continuous=false;recognition.interimResults=false;recognition.lang='en-US';
  recognition.onstart=()=>{if(!assistantSpeaking)document.getElementById('status').textContent=listeningForCommand?'🎤 Listening...':'👂 Listening for "Hey Assistant"...'};
  recognition.onresult=e=>{
    if(assistantSpeaking)return;
    const text=e.results[0][0].transcript.trim();
    document.getElementById('heard').textContent='You said: '+text;
    if(!listeningForCommand){
      const lower=text.toLowerCase();
      if(lower.includes('hey assistant')||lower.includes('hey computer')){listeningForCommand=true;speak('Yes? How can I help?')}
      return;
    }
    listeningForCommand=false;
    handleCommand(text);
  };
  recognition.onerror=e=>{console.log('Speech error:',e.error);listeningForCommand=false;if(!assistantSpeaking)document.getElementById('status').textContent='❌ Microphone error'};
  recognition.onend=()=>{if(!assistantSpeaking&&wakeMode&&!listeningForCommand)setTimeout(listenForWakeWord,1500)};
}else{document.getElementById('status').textContent='❌ Voice recognition is not supported in this browser.'}

function startListening(){if(!recognition){speak('Your browser does not support voice recognition.');return}if(assistantSpeaking)return;listeningForCommand=true;try{recognition.start()}catch(e){console.log(e)}}
function listenForWakeWord(){if(!wakeMode||listeningForCommand||assistantSpeaking||!recognition)return;try{recognition.start()}catch(e){}}
function toggleWakeMode(){if(!recognition){speak('Voice recognition is not available.');return}wakeMode=!wakeMode;const b=document.getElementById('wakeButton');if(wakeMode){b.textContent='🔴 DISABLE "HEY ASSISTANT"';speak('Wake mode is on. Say Hey Assistant.')}else{b.textContent='🟢 ENABLE "HEY ASSISTANT"';try{recognition.stop()}catch(e){}speak('Wake mode is off.')}}

function handleCommand(command){
  const text=command.toLowerCase().trim();
  if(text.includes('what time')||text.includes('time is it')||text.includes('tell me the time')||text.includes('current time')||text==='time'){sayTime();return}
  if(text.includes('weather')||text.includes('temperature')||text.includes('outside')){getWeather(true);return}
  if(text.includes('hello')||text==='hi'){sayHello();return}
  if(text.includes('youtube')){openYouTube();return}
  if(text.includes('google')){openGoogle();return}
  const tm=text.match(/(\d+(?:\.\d+)?)\s*(minute|minutes|min|mins)/);if(text.includes('timer')&&tm){setTimer(parseFloat(tm[1]));return}
  if(text.includes('call')){const c=getContacts();for(let i=0;i<c.length;i++){if(text.includes(c[i].name.toLowerCase())){callContact(i);return}}speak("I couldn't find that contact.");return}
  if(text.includes('text')||text.includes('message')){const c=getContacts();for(let i=0;i<c.length;i++){if(text.includes(c[i].name.toLowerCase())){textContact(i);return}}speak("I couldn't find that contact.");return}
  /* Everything else goes to the AI. */
  askGrandpaAI(command);
}
</script>
</body>
</html>
