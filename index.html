```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grandpa Assistant</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: min(900px, 95%);
  text-align: center;
  padding: 25px 0;
}

h1 {
  font-size: 48px;
  margin: 0 0 10px;
}

#clock {
  font-size: 60px;
  font-weight: bold;
  margin: 15px;
}

  font-size: 28px;
  min-height: 40px;
  margin: 15px;
}

#heard {
  font-size: 23px;
  min-height: 35px;
  margin: 15px;
}

button {
  border: none;

  padding: 20px 30px;

  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
}

  width: 85%;
  max-width: 600px;
  background: white;
  color: black;
}

#wakeButton {
  width: 85%;

  color: white;
}

.small {
  background: #333;
  color: white;
}

#weather {
  background: #222;
  border-radius: 20px;
  padding: 20px;
  margin: 25px auto;
  max-width: 700px;
  font-size: 27px;
}

#timer {
  font-size: 30px;
  margin: 20px;
  min-height: 40px;
}

#contacts {
  margin-top: 25px;
}

.contact {
  background: #222;
  border-radius: 18px;
  padding: 20px;
  margin: 15px auto;

}

.contactName {
  font-size: 28px;

}

}

.text {

}

  background: #8b0000;

}

  background: #222;
  border-radius: 20px;
  padding: 25px;
  margin-top: 25px;
}

input {
  padding: 15px;

}

</style>

<body>

<div class="app">

<h1>🎙️ Grandpa Assistant</h1>

<div id="clock">
  --:--
</div>

<div id="status">
  Ready
</div>

<div id="heard">
  Press TALK TO ME and speak.
</div>


<button
  id="talkButton"
  onclick="startListening()"
>
  🎤 TALK TO ME
</button>


<button
  id="wakeButton"
  onclick="toggleWakeMode()"
>
  🟢 ENABLE "HEY ASSISTANT"
</button>


<div id="weather">
  🌤️ Loading weather...
</div>


<div id="timer">
</div>


<button
  class="small"
  onclick="sayTime()"
>
  🕐 What time is it?
</button>


<button
  class="small"
  onclick="getWeather(true)"
>
  🌤️ Weather
</button>


<button
  class="small"
  onclick="sayHello()"
>
  👋 Hello
</button>


<button
  class="small"
  onclick="openYouTube()"
>
  ▶️ YouTube
</button>


<button
  class="small"
  onclick="openGoogle()"
>
  🔎 Google
</button>


<!-- FAMILY -->

<h2>
  👨‍👩‍👧 Family
</h2>

<div id="contacts">
</div>


<!-- CONTACT SETTINGS -->

<div id="settings">

<h2>
  ➕ Add Family Contact
</h2>

<input
  id="contactName"
  placeholder="Name"
/>

<br>

<input
  id="contactPhone"
  placeholder="Phone number"
  type="tel"
/>

<br>

<button
  class="add"
  onclick="addContact()"
>
  Add Contact
</button>

</div>


<script>

/* ==================================================
   VARIABLES
================================================== */

let recognition = null;

let listeningForCommand = false;

let wakeMode = false;

let microphoneEnabled = true;

let assistantSpeaking = false;

let timerInterval = null;


/* ==================================================
   SPEAK
================================================== */

function speak(message) {

  /*
    STOP MICROPHONE FIRST.
    This prevents the assistant from
    hearing its own voice.
  */

  assistantSpeaking = true;

  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {

      console.log(error);

    }

  }

  listeningForCommand = false;

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(message);

  speech.rate = 0.9;

  speech.pitch = 1;

  document.getElementById("status").textContent =
    "🔊 Speaking...";

  speech.onend = function() {

    assistantSpeaking = false;

    document.getElementById("status").textContent =
      "Ready";

    /*
      Wait before turning the microphone
      back on so it doesn't hear the
      end of its own sentence.
    */

    if (
      wakeMode &&
      microphoneEnabled
    ) {

      setTimeout(
        listenForWakeWord,
        1500
      );

    }

  };

  speech.onerror = function() {

    assistantSpeaking = false;

    document.getElementById("status").textContent =
      "Ready";

  };

  window.speechSynthesis.speak(speech);

}


/* ==================================================
   CLOCK
================================================== */

function updateClock() {

  const now = new Date();

  const time =
    now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

  document.getElementById("clock").textContent =
    time;

}

setInterval(
  updateClock,
  1000
);

updateClock();


/* ==================================================
   TIME
================================================== */

function sayTime() {

  const now = new Date();

  const time =
    now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

  speak(
    "The time is " +
    time
  );

}


/* ==================================================
   HELLO
================================================== */

function sayHello() {

  speak(
    "Hello! How can I help you?"
  );

}


/* ==================================================
   WEATHER
================================================== */

async function getWeather(
  speakWeather = false
) {

  const box =
    document.getElementById("weather");

  box.textContent =
    "🌤️ Getting Artesia weather...";


  try {

    const latitude =
      32.8423;

    const longitude =
      -104.4406;


    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" +
      latitude +
      "&longitude=" +
      longitude +
      "&current=temperature_2m,weather_code,wind_speed_10m" +
      "&temperature_unit=fahrenheit" +
      "&wind_speed_unit=mph";


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Weather failed"
      );

    }


    const data =
      await response.json();


    const temperature =
      Math.round(
        data.current.temperature_2m
      );


    const wind =
      Math.round(
        data.current.wind_speed_10m
      );


    const description =
      weatherDescription(
        data.current.weather_code
      );


    box.innerHTML =
      "🌤️ <strong>Artesia, New Mexico</strong><br>" +
      temperature +
      "°F — " +
      description +
      "<br>💨 Wind: " +
      wind +
      " mph";


    if (speakWeather) {

      speak(
        "In Artesia, New Mexico, " +
        "it is " +
        temperature +
        " degrees Fahrenheit and " +
        description +
        "."
      );

    }

  } catch (error) {

    console.log(error);

    box.textContent =
      "❌ Weather unavailable.";

    if (speakWeather) {

      speak(
        "Sorry, I couldn't get the weather."
      );

    }

  }

}


function weatherDescription(code) {

  if (code === 0)
    return "clear skies";

  if (code === 1 || code === 2)
    return "partly cloudy";

  if (code === 3)
    return "cloudy";

  if (code >= 45 && code <= 48)
    return "foggy";

  if (code >= 51 && code <= 67)
    return "rain";

  if (code >= 71 && code <= 77)
    return "snow";

  if (code >= 80 && code <= 82)
    return "rain showers";

  if (code >= 95)
    return "thunderstorms";

  return "unknown conditions";

}

getWeather();


/* ==================================================
   TIMER
================================================== */

function setTimer(minutes) {

  if (
    !minutes ||
    minutes <= 0
  ) {

    speak(
      "Please tell me how many minutes."
    );

    return;

  }


  if (timerInterval) {

    clearInterval(
      timerInterval
    );

  }


  let seconds =
    Math.round(
      minutes * 60
    );


  const timerBox =
    document.getElementById("timer");


  speak(
    "Timer set for " +
    minutes +
    (
      minutes === 1
        ? " minute."
        : " minutes."
    )
  );


  function updateTimer() {

    const mins =
      Math.floor(
        seconds / 60
      );


    const secs =
      seconds % 60;


    timerBox.textContent =
      "⏰ Timer: " +
      mins +
      ":" +
      String(secs).padStart(
        2,
        "0"
      );


    if (
      seconds <= 0
    ) {

      clearInterval(
        timerInterval
      );

      timerInterval = null;


      timerBox.textContent =
        "🔔 TIMER FINISHED!";


      speak(
        "Your timer is finished."
      );


      return;

    }


    seconds--;

  }


  updateTimer();


  timerInterval =
    setInterval(
      updateTimer,
      1000
    );

}


/* ==================================================
   OPEN WEBSITES
================================================== */

function openYouTube() {

  speak(
    "Opening YouTube."
  );

  setTimeout(
    function() {

      window.open(
        "https://www.youtube.com/",
        "_blank"
      );

    },
    1000
  );

}


function openGoogle() {

  speak(
    "Opening Google."
  );

  setTimeout(
    function() {

      window.open(
        "https://www.google.com/",
        "_blank"
      );

    },
    1000
  );

}


/* ==================================================
   CONTACTS
================================================== */

function getContacts() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "grandpaContacts"
      )
    ) || [];

  } catch {

    return [];

  }

}


function saveContacts(
  contacts
) {

  localStorage.setItem(
    "grandpaContacts",
    JSON.stringify(
      contacts
    )
  );

  displayContacts();

}


function addContact() {

  const name =
    document.getElementById(
      "contactName"
    ).value.trim();


  const phone =
    document.getElementById(
      "contactPhone"
    ).value.trim();


  if (
    !name ||
    !phone
  ) {

    alert(
      "Enter a name and phone number."
    );

    return;

  }


  const contacts =
    getContacts();


  contacts.push({
    name: name,
    phone: phone
  });


  saveContacts(
    contacts
  );


  document.getElementById(
    "contactName"
  ).value = "";


  document.getElementById(
    "contactPhone"
  ).value = "";


  speak(
    name +
    " has been added."
  );

}


function displayContacts() {

  const box =
    document.getElementById(
      "contacts"
    );


  const contacts =
    getContacts();


  box.innerHTML = "";


  if (
    contacts.length === 0
  ) {

    box.innerHTML =
      "<p>No contacts yet.</p>";

    return;

  }


  contacts.forEach(
    function(contact, index) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "contact";


      div.innerHTML =
        '<div class="contactName">' +
        "👤 " +
        contact.name +
        "</div>" +

        '<button class="call" onclick="callContact(' +
        index +
        ')">📞 Call</button>' +

        '<button class="text" onclick="textContact(' +
        index +
        ')">💬 Text</button>' +

        '<br>' +

        '<button class="remove" onclick="removeContact(' +
        index +
        ')">🗑️ Remove</button>';


      box.appendChild(
        div
      );

    }
  );

}


function callContact(index) {

  const contacts =
    getContacts();


  const contact =
    contacts[index];


  if (!contact)
    return;


  if (
    confirm(
      "Call " +
      contact.name +
      "?"
    )
  ) {

    window.location.href =
      "tel:" +
      contact.phone;

  }

}


function textContact(index) {

  const contacts =
    getContacts();


  const contact =
    contacts[index];


  if (!contact)
    return;


  if (
    confirm(
      "Text " +
      contact.name +
      "?"
    )
  ) {

    window.location.href =
      "sms:" +
      contact.phone;

  }

}


function removeContact(index) {

  const contacts =
    getContacts();


  const contact =
    contacts[index];


  if (!contact)
    return;


  if (
    confirm(
      "Remove " +
      contact.name +
      "?"
    )
  ) {

    contacts.splice(
      index,
      1
    );


    saveContacts(
      contacts
    );

  }

}


displayContacts();


/* ==================================================
   SPEECH RECOGNITION
================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.lang =
    "en-US";


  recognition.onstart =
    function() {

      if (
        assistantSpeaking
      ) {

        return;

      }


      if (
        listeningForCommand
      ) {

        document.getElementById(
          "status"
        ).textContent =
          "🎤 Listening...";

      } else {

        document.getElementById(
          "status"
        ).textContent =
          '👂 Say "Hey Assistant"...';

      }

    };


  recognition.onresult =
    function(event) {

      /*
        Ignore microphone input while
        the assistant is speaking.
      */

      if (
        assistantSpeaking
      ) {

        return;

      }


      const text =
        event.results[0][0]
        .transcript
        .trim();


      document.getElementById(
        "heard"
      ).textContent =
        "You said: " +
        text;


      const lower =
        text.toLowerCase();


      /* WAKE MODE */

      if (
        !listeningForCommand
      ) {

        if (
          lower.includes(
            "hey assistant"
          ) ||
          lower.includes(
            "hey computer"
          )
        ) {

          listeningForCommand =
            true;


          speak(
            "Yes? How can I help?"
          );

        }

        return;

      }


      /* COMMAND */

      listeningForCommand =
        false;


      handleCommand(
        text
      );

    };


  recognition.onerror =
    function(event) {

      console.log(
        "Speech error:",
        event.error
      );


      listeningForCommand =
        false;


      if (
        !assistantSpeaking
      ) {

        document.getElementById(
          "status"
        ).textContent =
          "❌ Microphone error";

      }

    };


  recognition.onend =
    function() {

      /*
        NEVER restart the microphone
        while speaking.
      */

      if (
        assistantSpeaking
      ) {

        return;

      }


      if (
        wakeMode &&
        microphoneEnabled &&
        !listeningForCommand
      ) {

        setTimeout(
          listenForWakeWord,
          1500
        );

      }

    };

} else {

  document.getElementById(
    "status"
  ).textContent =
    "❌ Voice recognition is not supported.";

}


/* ==================================================
   START LISTENING
================================================== */

function startListening() {

  if (
    !microphoneEnabled
  ) {

    speak(
      "The microphone is turned off."
    );

    return;

  }


  if (
    !recognition
  ) {

    speak(
      "Your browser does not support voice recognition."
    );

    return;

  }


  if (
    assistantSpeaking
  ) {

    return;

  }


  listeningForCommand =
    true;


  try {

    recognition.start();

  } catch (error) {

    console.log(error);

  }

}


/* ==================================================
   WAKE WORD
================================================== */

function listenForWakeWord() {

  if (
    !wakeMode ||
    !microphoneEnabled ||
    listeningForCommand ||
    assistantSpeaking
  ) {

    return;

  }


  try {

    recognition.start();

  } catch (error) {

    console.log(error);

  }

}


/* ==================================================
   WAKE MODE BUTTON
================================================== */

function toggleWakeMode() {

  if (
    !microphoneEnabled
  ) {

    alert(
      "The microphone is turned off."
    );

    return;

  }


  wakeMode =
    !wakeMode;


  const button =
    document.getElementById(
      "wakeButton"
    );


  if (
    wakeMode
  ) {

    button.textContent =
      '🔴 DISABLE "HEY ASSISTANT"';


    speak(
      'Wake mode is on. Say "Hey Assistant".'
    );

  } else {

    button.textContent =
      '🟢 ENABLE "HEY ASSISTANT"';


    try {

      recognition.stop();

    } catch (error) {}


    speak(
      "Wake mode is off."
    );

  }

}


/* ==================================================
   COMMAND HANDLER
================================================== */

function handleCommand(
  command
) {

  const text =
    command.toLowerCase();


  /* TIME */

  if (
    text.includes("what time") ||
    text.includes("time is it") ||
    text.includes("tell me the time") ||
    text.includes("current time") ||
    text === "time"
  ) {

    sayTime();

    return;

  }


  /* WEATHER */

  if (
    text.includes("weather") ||
    text.includes("temperature") ||
    text.includes("outside")
  ) {

    getWeather(true);

    return;

  }


  /* HELLO */

  if (
    text.includes("hello") ||
    text === "hi"
  ) {

    sayHello();

    return;

  }


  /* YOUTUBE */

  if (
    text.includes("youtube")
  ) {

    openYouTube();

    return;

  }


  /* GOOGLE */

  if (
    text.includes("google")
  ) {

    openGoogle();

    return;

  }


  /* TIMER */

  const timerMatch =
    text.match(
      /(\d+(?:\.\d+)?)\s*(minute|minutes|min|mins)/
    );


  if (
    text.includes("timer") &&
    timerMatch
  ) {

    const minutes =
      parseFloat(
        timerMatch[1]
      );


    setTimer(
      minutes
    );


    return;

  }


  /* CALL */

  if (
    text.includes("call")
  ) {

    const contacts =
      getContacts();


    for (
      let i = 0;
      i < contacts.length;
      i++
    ) {

      if (
        text.includes(
          contacts[i].name.toLowerCase()
        )
      ) {

        callContact(i);

        return;

      }

    }


    speak(
      "I couldn't find that contact."
    );

    return;

  }


  /* TEXT */

  if (
    text.includes("text") ||
    text.includes("message")
  ) {

    const contacts =
      getContacts();


    for (
      let i = 0;
      i < contacts.length;
      i++
    ) {

      if (
        text.includes(
          contacts[i].name.toLowerCase()
        )
      ) {

        textContact(i);

        return;

      }

    }


    speak(
      "I couldn't find that contact."
    );

    return;

  }


  /* HELP */

  if (
    text.includes("help") ||
    text.includes("i need help")
  ) {

    speak(
      "You can ask me for the time, weather, a timer, or ask me to call or text a family member."
    );

    return;

  }


  /* UNKNOWN */

  speak(
    "I heard you say " +
    command +
    ". I don't know how to do that yet."
  );

}

</script>

</div>

</body>
</html>
```
