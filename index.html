<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grandpa Assistant</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;

  background: #111;
  color: white;

  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: min(1000px, 95%);
  text-align: center;
  padding: 20px 0;
}

h1 {
  font-size: 48px;
  margin: 0 0 5px;
}

#clock {
  font-size: 58px;
  font-weight: bold;
  margin: 10px;
}

#status {
  font-size: 30px;
  margin: 15px 0;
  min-height: 45px;
}

#heard {
  font-size: 24px;
  min-height: 35px;
  margin-bottom: 20px;
}

#weather {
  font-size: 28px;

  margin: 20px auto;
  padding: 20px;

  border-radius: 20px;
  background: #222;

  max-width: 700px;
}

#timer {
  font-size: 32px;
  margin: 20px;
  min-height: 40px;
}

button {
  border: none;
  border-radius: 20px;

  padding: 22px 35px;
  margin: 8px;

  font-size: 25px;
  font-weight: bold;

  cursor: pointer;
}

button:hover {
  transform: scale(1.03);
}

#listenButton {
  background: white;
  color: black;

  width: 80%;
  max-width: 600px;
}

#wakeButton {
  background: #1976d2;
  color: white;

  width: 80%;
  max-width: 600px;
}

#micButton {
  background: #444;
  color: white;

  width: 80%;
  max-width: 600px;
}

.small-button {
  background: #333;
  color: white;
}

.section-title {
  font-size: 30px;
  margin-top: 30px;
  margin-bottom: 10px;
}

.contact {
  background: #222;

  border-radius: 20px;

  padding: 20px;

  margin: 15px auto;

  max-width: 700px;
}

.contact-name {
  font-size: 30px;
  font-weight: bold;

  margin-bottom: 10px;
}

.call-button {
  background: #1769aa;
  color: white;
}

.text-button {
  background: #388e3c;
  color: white;
}

.delete-button {
  background: #8b0000;
  color: white;

  font-size: 18px;
  padding: 12px 20px;
}

.help-button {
  background: #b00020;
  color: white;

  width: 80%;
  max-width: 600px;

  font-size: 32px;
}

.settings-button {
  background: #555;
  color: white;

  width: 80%;
  max-width: 600px;
}

#helpMessage {
  display: none;

  background: #2a0000;

  border: 3px solid #ff4444;

  border-radius: 20px;

  padding: 25px;

  margin: 20px auto;

  max-width: 700px;

  font-size: 25px;
}

#settingsPanel {
  display: none;

  background: #222;

  border: 3px solid #777;

  border-radius: 20px;

  padding: 25px;

  margin: 20px auto;

  max-width: 700px;
}

#settingsPanel h2 {
  font-size: 32px;
}

#settingsPanel label {
  display: block;

  font-size: 22px;

  margin-top: 15px;
}

#settingsPanel input {
  width: 90%;

  padding: 15px;

  margin-top: 8px;

  border-radius: 10px;

  border: none;

  font-size: 20px;
}

.save-button {
  background: #1976d2;
  color: white;
}

.close-button {
  background: #555;
  color: white;
}

#savedMessage {
  font-size: 20px;
  margin-top: 15px;
  min-height: 25px;
}

#wakeStatus {
  font-size: 22px;
  margin: 10px;
}

.on {
  color: #4caf50;
}

.off {
  color: #ff5252;
}

#contacts {
  max-width: 800px;
  margin: auto;
}

.empty {
  font-size: 22px;
  color: #aaa;
  margin: 15px;
}

</style>
</head>


<body>


<main class="app">


<h1>
🎙️ Grandpa Assistant
</h1>


<div id="clock">
--:--
</div>


<div id="status">
Ready
</div>


<div id="heard">
Press the microphone and talk.
</div>


<button
id="listenButton"
onclick="startCommandListening()"
>
🎤 TALK TO ME
</button>


<button
id="wakeButton"
onclick="toggleWakeMode()"
>
🟢 ENABLE "HEY ASSISTANT"
</button>


<div id="wakeStatus">
Wake mode:
<span class="off">OFF</span>
</div>


<button
id="micButton"
onclick="toggleMicrophone()"
>
🔇 Microphone Control
</button>


<div id="weather">
🌤️ Loading weather...
</div>


<div id="timer"></div>


<button
class="small-button"
onclick="sayTime()"
>
🕐 What time is it?
</button>


<button
class="small-button"
onclick="getWeather(true)"
>
🌤️ Weather
</button>


<button
class="small-button"
onclick="sayHello()"
>
👋 Hello
</button>


<!-- FAMILY -->

<div class="section-title">
👨‍👩‍👧 Family
</div>


<div id="contacts">
</div>


<!-- SETTINGS -->

<div class="section-title">
⚙️ Settings
</div>


<button
class="settings-button"
onclick="showSettings()"
>
⚙️ Family Contacts
</button>


<div id="settingsPanel">


<h2>
👨‍👩‍👧 Family Contacts
</h2>


<label>
Contact name
</label>


<input
id="contactName"
type="text"
placeholder="Example: Helen"
>


<label>
Phone number
</label>


<input
id="contactPhone"
type="tel"
placeholder="Example: 5755551234"
>


<br>


<button
class="save-button"
onclick="addContact()"
>
➕ Add Contact
</button>


<button
class="close-button"
onclick="closeSettings()"
>
Close
</button>


<div id="savedMessage"></div>


</div>


<!-- HELP -->

<div class="section-title">
🆘 Need Help?
</div>


<button
class="help-button"
onclick="showHelp()"
>
🆘 I NEED HELP
</button>


<div id="helpMessage">


<strong>
Do you need help?
</strong>


<br><br>


You can contact one of your saved
family members.


<br><br>


<button
class="close-button"
onclick="closeHelp()"
>
Cancel
</button>


</div>


</main>


<script>


// =====================================================
// GLOBAL SETTINGS
// =====================================================


let microphoneEnabled = true;

let wakeMode = false;

let timerInterval = null;


// =====================================================
// TEXT TO SPEECH
// =====================================================


function speak(text) {


  if (!microphoneEnabled) {
    return;
  }


  window.speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(text);


  speech.rate = 0.9;

  speech.pitch = 1;


  window.speechSynthesis.speak(
    speech
  );


  document.getElementById(
    "status"
  ).textContent =
    "🔊 Speaking...";


  speech.onend = function() {

    document.getElementById(
      "status"
    ).textContent =
      "Ready";

  };

}


// =====================================================
// CLOCK
// =====================================================


function updateClock() {


  const now =
    new Date();


  const time =
    now.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );


  document.getElementById(
    "clock"
  ).textContent =
    time;

}


setInterval(
  updateClock,
  1000
);


updateClock();


// =====================================================
// HELLO
// =====================================================


function sayHello() {


  speak(
    "Hello! How can I help you?"
  );

}


// =====================================================
// TIME
// =====================================================


function sayTime() {


  const now =
    new Date();


  const time =
    now.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );


  speak(
    "The time is " +
    time
  );

}


// =====================================================
// WEATHER
// =====================================================


async function getWeather(
  speakWeather = false
) {


  const weatherBox =
    document.getElementById(
      "weather"
    );


  weatherBox.textContent =
    "🌤️ Getting Artesia weather...";


  try {


    const latitude =
      32.8423;


    const longitude =
      -104.4406;


    const url =

      "https://api.open-meteo.com/v1/forecast" +

      "?latitude=" +
      latitude +

      "&longitude=" +
      longitude +

      "&current=temperature_2m,weather_code,wind_speed_10m" +

      "&temperature_unit=fahrenheit" +

      "&wind_speed_unit=mph";


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Weather failed"
      );

    }


    const data =
      await response.json();


    const temperature =
      Math.round(
        data.current.temperature_2m
      );


    const wind =
      Math.round(
        data.current.wind_speed_10m
      );


    const description =
      getWeatherDescription(
        data.current.weather_code
      );


    weatherBox.innerHTML =

      "🌤️ <strong>" +

      "Artesia, New Mexico" +

      "</strong><br>" +

      temperature +

      "°F — " +

      description +

      "<br>💨 Wind: " +

      wind +

      " mph";


    if (speakWeather) {


      speak(

        "In Artesia, New Mexico, " +

        "it is " +

        temperature +

        " degrees Fahrenheit and " +

        description +

        "."

      );

    }


  } catch (error) {


    console.error(error);


    weatherBox.textContent =
      "❌ Couldn't get the weather.";


    if (speakWeather) {

      speak(
        "Sorry, I couldn't get the weather."
      );

    }

  }

}


function getWeatherDescription(code) {


  if (code === 0)
    return "clear skies";


  if (code === 1 || code === 2)
    return "partly cloudy";


  if (code === 3)
    return "cloudy";


  if (code >= 45 && code <= 48)
    return "foggy";


  if (code >= 51 && code <= 67)
    return "rain";


  if (code >= 71 && code <= 77)
    return "snow";


  if (code >= 80 && code <= 82)
    return "rain showers";


  if (code >= 95)
    return "thunderstorms";


  return "unknown conditions";

}


getWeather();


// =====================================================
// TIMERS
// =====================================================


function setTimer(minutes) {


  if (
    !minutes ||
    minutes <= 0
  ) {


    speak(
      "Please tell me how many minutes."
    );


    return;

  }


  const timerBox =
    document.getElementById(
      "timer"
    );


  if (timerInterval) {

    clearInterval(
      timerInterval
    );

  }


  let seconds =
    Math.round(
      minutes * 60
    );


  speak(

    "Okay. Timer set for " +

    minutes +

    (
      minutes === 1
        ? " minute."
        : " minutes."
    )

  );


  function updateTimer() {


    const mins =
      Math.floor(
        seconds / 60
      );


    const secs =
      seconds % 60;


    timerBox.textContent =

      "⏰ Timer: " +

      mins +

      ":" +

      String(
        secs
      ).padStart(
        2,
        "0"
      );


    if (seconds <= 0) {


      clearInterval(
        timerInterval
      );


      timerInterval =
        null;


      timerBox.textContent =
        "🔔 TIMER FINISHED!";


      speak(
        "Your timer is finished."
      );


      return;

    }


    seconds--;

  }


  updateTimer();


  timerInterval =
    setInterval(
      updateTimer,
      1000
    );

}


// =====================================================
// CONTACTS
// =====================================================


function getContacts() {


  try {


    return JSON.parse(
      localStorage.getItem(
        "grandpaContacts"
      )
    ) || [];


  } catch (error) {


    return [];

  }

}


function saveContacts(contacts) {


  localStorage.setItem(

    "grandpaContacts",

    JSON.stringify(
      contacts
    )

  );


  displayContacts();

}


function displayContacts() {


  const contactsBox =
    document.getElementById(
      "contacts"
    );


  const contacts =
    getContacts();


  contactsBox.innerHTML = "";


  if (
    contacts.length === 0
  ) {


    contactsBox.innerHTML =

      '<div class="empty">' +

      "No family contacts added yet." +

      "</div>";


    return;

  }


  contacts.forEach(
    function(contact, index) {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "contact";


      div.innerHTML =

        '<div class="contact-name">' +

        "👤 " +

        escapeHTML(
          contact.name
        ) +

        "</div>" +


        '<button class="call-button" ' +

        'onclick="callContact(' +

        index +

        ')">' +

        "📞 Call" +

        "</button>" +


        '<button class="text-button" ' +

        'onclick="textContact(' +

        index +

        ')">' +

        "💬 Text" +

        "</button>" +


        '<br>' +


        '<button class="delete-button" ' +

        'onclick="deleteContact(' +

        index +

        ')">' +

        "🗑️ Remove" +

        "</button>";


      contactsBox.appendChild(
        div
      );

    }
  );

}


function escapeHTML(text) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


// =====================================================
// ADD CONTACT
// =====================================================


function addContact() {


  const name =
    document.getElementById(
      "contactName"
    ).value.trim();


  const phone =
    document.getElementById(
      "contactPhone"
    ).value.trim();


  if (!name || !phone) {


    alert(
      "Please enter both a name and phone number."
    );


    return;

  }


  const contacts =
    getContacts();


  contacts.push({

    name: name,

    phone: phone

  });


  saveContacts(
    contacts
  );


  document.getElementById(
    "contactName"
  ).value = "";


  document.getElementById(
    "contactPhone"
  ).value = "";


  document.getElementById(
    "savedMessage"
  ).textContent =

    "✅ Contact added!";


  speak(
    name +
    " has been added to your family contacts."
  );

}


// =====================================================
// DELETE CONTACT
// =====================================================


function deleteContact(index) {


  const contacts =
    getContacts();


  const contact =
    contacts[index];


  if (!contact) {
    return;
  }


  const confirmed =
    confirm(

      "Remove " +

      contact.name +

      " from family contacts?"

    );


  if (!confirmed) {
    return;
  }


  contacts.splice(
    index,
    1
  );


  saveContacts(
    contacts
  );


  speak(
    contact.name +
    " was removed."
  );

}


// =====================================================
// CALL CONTACT
// =====================================================


function callContact(index) {


  const contacts =
    getContacts();


  const contact =
    contacts[index];


  if (!contact) {
    return;
  }


  const confirmed =
    confirm(

      "Call " +
      contact.name +
      "?"

    );


  if (!confirmed) {
    return;
  }


  speak(

    "Opening a call to " +

    contact.name

  );


  setTimeout(
    function() {


      window.location.href =
        "tel:" +
        contact.phone;


    },
    800
  );

}


// =====================================================
// TEXT CONTACT
// =====================================================


function textContact(index) {


  const contacts =
    getContacts();


  const contact =
    contacts[index];


  if (!contact) {
    return;
  }


  const confirmed =
    confirm(

      "Open a text message to " +

      contact.name +

      "?"

    );


  if (!confirmed) {
    return;
  }


  speak(

    "Opening a text message to " +

    contact.name

  );


  setTimeout(
    function() {


      window.location.href =
        "sms:" +
        contact.phone;


    },
    800
  );

}


// =====================================================
// SETTINGS
// =====================================================


function showSettings() {


  document.getElementById(
    "settingsPanel"
  ).style.display =
    "block";


}


function closeSettings() {


  document.getElementById(
    "settingsPanel"
  ).style.display =
    "none";


}


// =====================================================
// HELP
// =====================================================


function showHelp() {


  document.getElementById(
    "helpMessage"
  ).style.display =
    "block";


  speak(

    "You selected help. " +

    "Choose a family member to call."

  );

}


function closeHelp() {


  document.getElementById(
    "helpMessage"
  ).style.display =
    "none";


}


// =====================================================
// MICROPHONE
// =====================================================


function toggleMicrophone() {


  microphoneEnabled =
    !microphoneEnabled;


  const button =
    document.getElementById(
      "micButton"
    );


  if (microphoneEnabled) {


    button.textContent =
      "🔇 Microphone Control";


    document.getElementById(
      "status"
    ).textContent =
      "Ready";


  } else {


    button.textContent =
      "🔴 MICROPHONE OFF";


    document.getElementById(
      "status"
    ).textContent =
      "🔴 Microphone disabled";


    if (recognition) {


      try {

        recognition.stop();

      } catch (e) {}

    }

  }

}


// =====================================================
// SPEECH RECOGNITION
// =====================================================


const SpeechRecognition =

  window.SpeechRecognition ||

  window.webkitSpeechRecognition;


let recognition;


if (SpeechRecognition) {


  recognition =
    new SpeechRecognition();


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.lang =
    "en-US";


  recognition.onstart =
    function() {


      document.getElementById(
        "status"
      ).textContent =
        "🎤 Listening...";

    };


  recognition.onerror =
    function(event) {


      console.log(
        "Speech error:",
        event.error
      );


      document.getElementById(
        "status"
      ).textContent =
        "❌ Microphone error";

    };


  recognition.onend =
    function() {


      if (
        wakeMode &&
        microphoneEnabled
      ) {


        setTimeout(
          listenForWakeWord,
          500
        );

      }

    };

}


// =====================================================
// NORMAL LISTENING
// =====================================================


function startCommandListening() {


  if (!microphoneEnabled) {


    speak(
      "The microphone is turned off."
    );


    return;

  }


  if (!recognition) {


    speak(
      "Sorry, your browser doesn't support voice recognition."
    );


    return;

  }


  recognition.onresult =
    commandResult;


  try {


    recognition.start();


  } catch (error) {


    console.log(error);

  }

}


function commandResult(event) {


  const text =
    event.results[0][0].transcript;


  document.getElementById(
    "heard"
  ).textContent =

    "You said: " +
    text;


  handleCommand(
    text
  );

}


// =====================================================
// WAKE MODE
// =====================================================


function toggleWakeMode() {


  if (!microphoneEnabled) {


    alert(
      "Turn the microphone on first."
    );


    return;

  }


  wakeMode =
    !wakeMode;


  const button =
    document.getElementById(
      "wakeButton"
    );


  const status =
    document.getElementById(
      "wakeStatus"
    );


  if (wakeMode) {


    button.textContent =
      '🔴 DISABLE "HEY ASSISTANT"';


    status.innerHTML =
      'Wake mode: <span class="on">ON</span>';


    speak(
      "Wake mode is on. Say Hey Assistant."
    );


    setTimeout(
      listenForWakeWord,
      1500
    );


  } else {


    button.textContent =
      '🟢 ENABLE "HEY ASSISTANT"';


    status.innerHTML =
      'Wake mode: <span class="off">OFF</span>';


    speak(
      "Wake mode is off."
    );


    try {

      recognition.stop();

    } catch (e) {}

  }

}


function listenForWakeWord() {


  if (
    !wakeMode ||
    !microphoneEnabled
  ) {

    return;

  }


  try {


    recognition.onresult =
      wakeWordResult;


    recognition.start();


  } catch (error) {


    console.log(error);

  }

}


function wakeWordResult(event) {


  const text =
    event.results[0][0].transcript;


  const lower =
    text.toLowerCase();


  document.getElementById(
    "heard"
  ).textContent =

    "Heard: " +
    text;


  if (

    lower.includes(
      "hey assistant"
    ) ||

    lower.includes(
      "hey computer"
    )

  ) {


    speak(
      "Yes? How can I help?"
    );


    setTimeout(
      startCommandListening,
      1200
    );


    return;

  }


  if (wakeMode) {


    setTimeout(
      listenForWakeWord,
      500
    );

  }

}


// =====================================================
// FIND CONTACT BY NAME
// =====================================================


function findContactByCommand(text) {


  const contacts =
    getContacts();


  for (
    let i = 0;
    i < contacts.length;
    i++
  ) {


    if (
      text.includes(
        contacts[i].name.toLowerCase()
      )
    ) {


      return contacts[i];

    }

  }


  return null;

}


// =====================================================
// COMMAND PROCESSING
// =====================================================


function handleCommand(command) {


  const text =
    command.toLowerCase();


  // WEATHER


  if (

    text.includes("weather") ||

    text.includes("temperature") ||

    text.includes("outside")

  ) {


    getWeather(true);

    return;

  }


  // TIME


  if (

    text.includes("what time") ||

    text.includes("time is it")

  ) {


    sayTime();

    return;

  }


  // HELLO


  if (

    text.includes("hello") ||

    text.includes("hi")

  ) {


    sayHello();

    return;

  }


  // HELP


  if (

    text.includes("help") ||

    text.includes("i need help")

  ) {


    showHelp();

    return;

  }


  // CALL CONTACT


  if (
    text.includes("call")
  ) {


    const contact =
      findContactByCommand(
        text
      );


    if (contact) {


      const contacts =
        getContacts();


      const index =
        contacts.indexOf(
          contact
        );


      callContact(
        index
      );


      return;

    }


    speak(
      "I couldn't find that family member."
    );


    return;

  }


  // TEXT CONTACT


  if (

    text.includes("text") ||

    text.includes("message")

  ) {


    const contact =
      findContactByCommand(
        text
      );


    if (contact) {


      const contacts =
        getContacts();


      const index =
        contacts.indexOf(
          contact
        );


      textContact(
        index
      );


      return;

    }


    speak(
      "I couldn't find that family member."
    );


    return;

  }


  // YOUTUBE


  if (
    text.includes("youtube")
  ) {


    speak(
      "Opening YouTube."
    );


    setTimeout(
      function() {


        window.open(
          "https://www.youtube.com/",
          "_blank"
        );


      },
      1000
    );


    return;

  }


  // GOOGLE


  if (
    text.includes("google")
  ) {


    speak(
      "Opening Google."
    );


    setTimeout(
      function() {


        window.open(
          "https://www.google.com/",
          "_blank"
        );


      },
      1000
    );


    return;

  }


  // TIMER


  const timerMatch =

    text.match(

      /(\d+(?:\.\d+)?)\s*(minute|minutes|min|mins)/

    );


  if (

    text.includes("timer") &&

    timerMatch

  ) {


    const minutes =

      parseFloat(
        timerMatch[1]
      );


    setTimer(
      minutes
    );


    return;

  }


  // UNKNOWN


  speak(

    "I heard you say " +

    command +

    ". I don't know how to do that yet."

  );

}


// =====================================================
// STARTUP
// =====================================================


displayContacts();


</script>
