<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grandpa Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: min(1000px, 95%);
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 5px;
    }

    #clock {
      font-size: 52px;
      font-weight: bold;
      margin: 10px;
    }

    #status {
      font-size: 28px;
      margin: 15px 0;
      min-height: 40px;
    }

    #heard {
      font-size: 24px;
      min-height: 35px;
      margin-bottom: 20px;
    }

    #weather {
      font-size: 28px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 20px;
      background: #222;
      max-width: 700px;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 22px 35px;
      margin: 8px;
      font-size: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    #listenButton {
      background: white;
      color: black;
      width: 80%;
      max-width: 600px;
    }

    .small-button {
      background: #333;
      color: white;
    }

    #timer {
      font-size: 32px;
      margin: 20px;
      min-height: 40px;
    }
  </style>
</head>

<body>

<main class="app">

  <h1>🎙️ Grandpa Assistant</h1>

  <div id="clock">--:--</div>

  <div id="status">Ready</div>

  <div id="heard">
    Press the microphone and talk.
  </div>

  <button id="listenButton" onclick="startListening()">
    🎤 TALK TO ME
  </button>

  <div id="weather">
    🌤️ Loading weather...
  </div>

  <div id="timer"></div>

  <button class="small-button" onclick="sayTime()">
    🕐 What time is it?
  </button>

  <button class="small-button" onclick="getWeather()">
    🌤️ Weather
  </button>

  <button class="small-button" onclick="sayHello()">
    👋 Hello
  </button>

</main>

<script>

  // =========================
  // TEXT TO SPEECH
  // =========================

  function speak(text) {

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.rate = 0.9;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);

    document.getElementById("status").textContent =
      "🔊 Speaking...";

    speech.onend = function() {
      document.getElementById("status").textContent =
        "Ready";
    };
  }


  // =========================
  // CLOCK
  // =========================

  function updateClock() {

    const now = new Date();

    const time = now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

    document.getElementById("clock").textContent = time;
  }

  setInterval(updateClock, 1000);
  updateClock();


  // =========================
  // HELLO
  // =========================

  function sayHello() {
    speak("Hello! How can I help you?");
  }


  // =========================
  // TIME
  // =========================

  function sayTime() {

    const now = new Date();

    const time = now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

    speak("The time is " + time);
  }


  // =========================
  // WEATHER
  // Artesia, New Mexico
  // =========================

  async function getWeather(speakWeather = false) {

    const weatherBox =
      document.getElementById("weather");

    weatherBox.textContent =
      "🌤️ Getting Artesia weather...";

    try {

      // Artesia, New Mexico coordinates
      const latitude = 32.8423;
      const longitude = -104.4406;

      const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + latitude +
        "&longitude=" + longitude +
        "&current=temperature_2m,weather_code,wind_speed_10m" +
        "&temperature_unit=fahrenheit" +
        "&wind_speed_unit=mph";

      const response = await fetch(url);

      const data = await response.json();

      const temperature =
        Math.round(data.current.temperature_2m);

      const wind =
        Math.round(data.current.wind_speed_10m);

      const description =
        getWeatherDescription(
          data.current.weather_code
        );

      weatherBox.innerHTML =
        "🌤️ <strong>Artesia, New Mexico</strong><br>" +
        temperature + "°F — " +
        description +
        "<br>💨 Wind: " +
        wind + " mph";

      if (speakWeather) {

        speak(
          "In Artesia, New Mexico, " +
          "it is " + temperature +
          " degrees Fahrenheit and " +
          description + "."
        );
      }

    } catch (error) {

      weatherBox.textContent =
        "❌ Couldn't get the weather.";

      if (speakWeather) {
        speak(
          "Sorry, I couldn't get the weather right now."
        );
      }
    }
  }


  function getWeatherDescription(code) {

    if (code === 0)
      return "clear skies";

    if (code === 1 || code === 2)
      return "partly cloudy";

    if (code === 3)
      return "cloudy";

    if (code >= 45 && code <= 48)
      return "foggy";

    if (code >= 51 && code <= 67)
      return "rain";

    if (code >= 71 && code <= 77)
      return "snow";

    if (code >= 80 && code <= 82)
      return "rain showers";

    if (code >= 95)
      return "thunderstorms";

    return "unknown conditions";
  }

  getWeather();


  // =========================
  // TIMER
  // =========================

  function setTimer(minutes) {

    if (!minutes || minutes <= 0) {
      speak("Please tell me how many minutes.");
      return;
    }

    const timerBox =
      document.getElementById("timer");

    let seconds = Math.round(minutes * 60);

    speak(
      "Okay. Timer set for " +
      minutes +
      (minutes === 1 ? " minute." : " minutes.")
    );

    function updateTimer() {

      const mins =
        Math.floor(seconds / 60);

      const secs =
        seconds % 60;

      timerBox.textContent =
        "⏰ Timer: " +
        mins +
        ":" +
        String(secs).padStart(2, "0");

      if (seconds <= 0) {

        clearInterval(timerInterval);

        timerBox.textContent =
          "🔔 TIMER FINISHED!";

        speak(
          "Your timer is finished."
        );

        return;
      }

      seconds--;
    }

    updateTimer();

    const timerInterval =
      setInterval(updateTimer, 1000);
  }


  // =========================
  // SPEECH RECOGNITION
  // =========================

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  let recognition;

  if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-US";

    recognition.onstart = function() {

      document.getElementById("status").textContent =
        "🎤 Listening...";
    };

    recognition.onresult = function(event) {

      const text =
        event.results[0][0].transcript;

      document.getElementById("heard").textContent =
        "You said: " + text;

      document.getElementById("status").textContent =
        "🧠 Thinking...";

      handleCommand(text);
    };

    recognition.onerror = function(event) {

      document.getElementById("status").textContent =
        "❌ Microphone error";

      console.log(event.error);
    };

  } else {

    document.getElementById("status").textContent =
      "Speech recognition isn't supported.";
  }


  function startListening() {

    if (!recognition) {

      speak(
        "Sorry, your browser doesn't support voice recognition."
      );

      return;
    }

    recognition.start();
  }


  // =========================
  // COMMAND PROCESSING
  // =========================

  function handleCommand(command) {

    const text =
      command.toLowerCase();


    // WEATHER

    if (
      text.includes("weather") ||
      text.includes("temperature") ||
      text.includes("outside")
    ) {

      getWeather(true);

      return;
    }


    // TIME

    if (
      text.includes("what time") ||
      text.includes("time is it")
    ) {

      sayTime();

      return;
    }


    // HELLO

    if (
      text.includes("hello") ||
      text.includes("hi")
    ) {

      sayHello();

      return;
    }


    // YOUTUBE

    if (text.includes("youtube")) {

      speak("Opening YouTube.");

      setTimeout(function() {

        window.open(
          "https://www.youtube.com/",
          "_blank"
        );

      }, 1000);

      return;
    }


    // GOOGLE

    if (text.includes("google")) {

      speak("Opening Google.");

      setTimeout(function() {

        window.open(
          "https://www.google.com/",
          "_blank"
        );

      }, 1000);

      return;
    }


    // TIMER

    const timerMatch =
      text.match(
        /(\d+(?:\.\d+)?)\s*(minute|minutes|min|mins)/
      );

    if (
      text.includes("timer") &&
      timerMatch
    ) {

      const minutes =
        parseFloat(timerMatch[1]);

      setTimer(minutes);

      return;
    }


    // HELP

    if (text.includes("help")) {

      speak(
        "I'm here. Please contact your family if you need assistance."
      );

      return;
    }


    // UNKNOWN

    speak(
      "I heard you say " +
      command +
      ". I don't know how to do that yet."
    );
  }

</script>

</body>
</html>
